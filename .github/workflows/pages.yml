name: Publish A Book flasher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.8.1
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 446599/a-book
          ref: main
          ssh-key: ${{ secrets.ABOOK_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false

      - name: Assemble site with verified release firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            release_tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          else
            release_tag="$RELEASE_TAG_INPUT"
          fi

          release_dir="$RUNNER_TEMP/release"
          unpack_dir="$RUNNER_TEMP/unpacked"
          dist_dir="$GITHUB_WORKSPACE/dist"
          mkdir -p "$release_dir" "$unpack_dir" "$dist_dir"
          gh release download "$release_tag" --repo "$GH_REPO" \
            --pattern 'A_Book-*.zip' --dir "$release_dir"
          package_zip="$(find "$release_dir" -maxdepth 1 -type f -name 'A_Book-*.zip' -print -quit)"
          test -n "$package_zip"
          unzip -q "$package_zip" -d "$unpack_dir"
          package_dir="$(find "$unpack_dir" -mindepth 1 -maxdepth 1 -type d -name 'A_Book-*' -print -quit)"
          test -n "$package_dir"
          (cd "$package_dir" && sha256sum -c SHA256SUMS.txt)
          jq -e --arg version "${release_tag#v}" '.version == $version' \
            "$package_dir/manifest.json" >/dev/null

          rsync -a --exclude='.git/' --exclude='firmware/' \
            "$GITHUB_WORKSPACE/source/web/" "$dist_dir/"
          mkdir -p "$dist_dir/firmware"
          cp "$package_dir/manifest.json" \
            "$package_dir/bootloader.bin" \
            "$package_dir/partition-table.bin" \
            "$package_dir/A_Book.bin" \
            "$package_dir/font_head.bin" \
            "$package_dir/font_body.bin" \
            "$package_dir/font_tail.bin" \
            "$dist_dir/firmware/"

          test -s "$dist_dir/index.html"
          test -s "$dist_dir/firmware/manifest.json"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
